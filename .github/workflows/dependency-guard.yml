name: Dependency Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-guard:
    name: Dependency Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit package signatures
        run: npm audit signatures

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Review dependency changes
        if: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

      - name: Dependency review unavailable
        if: ${{ github.event.repository.visibility != 'public' && vars.ENABLE_DEPENDENCY_REVIEW != 'true' }}
        run: >
          echo "Skipping dependency-review-action because this repository is private and
          ENABLE_DEPENDENCY_REVIEW is not true; npm signature and vulnerability audits
          above remain required."
