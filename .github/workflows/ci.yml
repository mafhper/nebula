name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # A check ".github/dependabot.yml" do GitHub roda SO no push para a main:
      # um config invalido passa o PR inteiro e so quebra depois do merge. Aqui
      # a validacao roda no PR, contra o schema oficial.
      # exit 1 = config invalido (falha). exit 2 = schema indisponivel (aviso):
      # sem rede o check nao tem o que judging, e vermelho por causa disso seria
      # alarme falso.
      - name: Validate Dependabot config
        run: |
          set +e
          node scripts/validar-dependabot.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::schema do Dependabot indisponivel; validacao pulada"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Visual test
        run: npm run test:visual -- --reporter=list

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: output/playwright/results/
          retention-days: 7

      - name: Build
        run: npm run build

      # O NBL-N8: o turbo cacheava o build como bem-sucedido sem guardar a
      # saida (outputs: []), entao `npm run build` reportava 8/8 e nao
      # produzia dist/. Este passo falha o CI nesse caso, para que um build
      # vazio nunca chegue a ser mergeado como verde.
      - name: Assert build output
        run: |
          if [ ! -f apps/web/dist/index.html ]; then
            echo "::error::npm run build terminou sem apps/web/dist/index.html."
            echo "::error::Se o cache do turbo restaurou sem saida, verifique 'outputs' em turbo.json."
            exit 1
          fi
          echo "build ok: $(find apps/web/dist -type f | wc -l) arquivos em apps/web/dist"
