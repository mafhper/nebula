version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    # Rebase automatico quando a branch fica atrasada. O ruleset e strict
    # up-to-date, entao um PR que envelhece e recusado no merge mesmo com
    # todos os checks verdes. 'auto' ja e o default do Dependabot; declarar
    # aqui deixa a intencao explicita e impede que um 'disabled' futuro
    # reintroduza o problema em silencio.
    rebase-strategy: auto
    # Agrupa patch e minor em UM PR. Sem agrupar, o Dependabot abre um PR por
    # pacote e quatro bumps rotineiros viram quatro PRs para revisar.
    #
    # Major fica DE FORA do grupo de proposito: um salto de major muda tipos e
    # pode quebrar o build, entao continua com PR proprio e atencao propria.
    # Misturar major com patch no mesmo PR transformaria a revisao do
    # arriscado num diff de rotina. Major bloqueado por incompatibilidade real
    # entra em `ignore` mais abaixo, com o motivo medido.
    #
    # A opcao "Grouped security updates" das Settings agrupa updates de
    # SEGURANCA, nao de versao. Agrupar versao so neste arquivo.
    groups:
      npm-patch-minor:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
    # Major do typescript travado ate o typescript-eslint declarar suporte.
    # Medido em 2026-10-02: typescript-eslint@8.70.1 declara peer
    # "typescript >=4.8.4 <6.1.0", entao o TS 7 nao instala --
    # `npm ci` (o que a CI roda) sai com ERESOLVE. Sem este ignore o
    # Dependabot reabre o mesmo PR toda semana, sempre nao-mergeavel.
    # Só remove quando o peer range cobrir a 7.x.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:30'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Agrupa TODAS as actions em um PR. Sem agrupar, o Dependabot abre um PR
    # por acao: o codeql-action/init e o codeql-action/analyze sao fixados no
    # mesmo SHA e PRECISAM subir juntos, mas cada um virava um PR separado. O
    # job ficava com versoes misturadas e falhava com
    # "Loaded a configuration file for version 4.38.0, but running version
    # 4.38.2" — e mergear qualquer um dos dois isoladamente quebrava a main.
    groups:
      github-actions:
        patterns:
          - '*'
